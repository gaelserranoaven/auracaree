<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" />
<title>AuraCare · Registro de cuidado para centros de protección & Notaría Médica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --tinta:#0E3A5D; --tinta-2:#16507C;
    --fondo:#F4F8FA; --panel:#FFFFFF;
    --vital:#0FA47A; --vital-suave:#E2F5EE;
    --alerta:#D8492B; --alerta-suave:#FCEAE5;
    --vigilancia:#DB9A2E; --vigilancia-suave:#FBF1DE;
    --texto:#1E2F38; --texto-2:#56707D; --linea:#DCE7EC;
    --radio:14px;
    --sombra:0 1px 2px rgba(14,58,93,.06),0 8px 24px -12px rgba(14,58,93,.14);
    --cifrado:#6366F1; --cifrado-suave:#EEF2FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--fondo);color:var(--texto);font-size:15px;line-height:1.5}
  h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.01em}
  .mono{font-family:'IBM Plex Mono',monospace}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--texto)}
  :focus-visible{outline:3px solid rgba(15,164,122,.45);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* LOGIN & REGISTRO */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(900px 500px at 85% -10%, rgba(15,164,122,.14), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, rgba(14,58,93,.10), transparent 55%), var(--fondo);padding:24px}
  .login-card{background:var(--panel);border:1px solid var(--linea);border-radius:20px;box-shadow:var(--sombra);width:100%;max-width:480px;padding:40px 36px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-name{font-family:'Sora';font-weight:700;font-size:22px;color:var(--tinta)}
  .brand-name em{font-style:normal;color:var(--vital)}
  .login-card h1{font-size:23px;margin:20px 0 6px;color:var(--tinta)}
  .login-card p.sub{color:var(--texto-2);font-size:13.5px;margin-bottom:20px}
  
  .auth-tabs{display:flex;border-bottom:2px solid var(--linea);margin-bottom:20px}
  .auth-tabs button{flex:1;padding:10px;font-weight:600;font-size:14px;background:none;color:var(--texto-2);border-bottom:3px solid transparent;margin-bottom:-2px}
  .auth-tabs button.active{color:var(--vital);border-bottom-color:var(--vital)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--texto-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .field .rango-hint{display:block;font-size:11px;color:var(--texto-2);margin-top:2px;font-weight:400;text-transform:none}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--linea);border-radius:10px;background:#FBFDFE;transition:border-color .15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--vital);outline:none;box-shadow:0 0 0 3px rgba(15,164,122,.15)}
  
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;transition:transform .1s,box-shadow .15s,background .15s}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--vital);color:#fff;box-shadow:0 6px 16px -6px rgba(15,164,122,.55)}
  .btn-primary:hover:not(:disabled){background:#0C8E69}
  .btn-ghost{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
  .btn-ghost:hover{border-color:var(--tinta-2);background:#F2F7FA}
  .btn-tinta{background:var(--tinta);color:#fff}
  .btn-tinta:hover{background:var(--tinta-2)}
  .btn-peligro{background:var(--alerta-suave);color:var(--alerta);border:1px solid #F2C4B6}

  /* COOKIES BANNER & LEGAL */
  .cookie-banner{position:fixed;bottom:20px;left:20px;right:20px;max-width:880px;margin:0 auto;background:#0E3A5D;color:#fff;padding:20px 24px;border-radius:16px;box-shadow:0 16px 40px rgba(14,58,93,.35);z-index:100;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border:1px solid rgba(255,255,255,.15)}
  .cookie-txt{flex:1;min-width:280px;font-size:13.5px;line-height:1.45;color:#E0ECF4}
  .cookie-txt b{color:#fff}
  .cookie-txt a{color:var(--vital-suave);text-decoration:underline;cursor:pointer}

  /* MAIN SHELL */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:250px;flex:none;background:linear-gradient(180deg,var(--tinta) 0%,#0B2F4C 100%);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .brand-name{color:#fff;font-size:19px}
  .sede-select{margin:18px 0 8px}
  .sede-select label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9FC2D8;display:block;margin-bottom:6px}
  .sede-select select{width:100%;background:#0B2F4C;color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:9px 10px}
  .nav{margin-top:14px;display:flex;flex-direction:column;gap:4px}
  .nav button{display:flex;align-items:center;gap:10px;background:transparent;color:#C9DDEA;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background .15s,color .15s}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.active{background:var(--vital);color:#fff;font-weight:600}
  .nav .badge{margin-left:auto;background:var(--alerta);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px}
  .sidebar-foot{margin-top:auto;font-size:11px;color:#9FC2D8;line-height:1.45;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}

  .main{flex:1;min-width:0;padding:22px 30px 60px}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;background:#fff;border:1px solid var(--linea);border-radius:16px;padding:12px 20px;box-shadow:var(--sombra)}
  .topbar .titulo h2{font-size:19px;color:var(--tinta)}
  .topbar .titulo p{font-size:12.5px;color:var(--texto-2)}
  .topbar .spacer{flex:1}
  .jornada-pill{display:flex;border:1.5px solid var(--linea);border-radius:99px;overflow:hidden;background:#fff}
  .jornada-pill button{padding:6px 14px;font-size:12.5px;font-weight:600;background:#fff;color:var(--texto-2)}
  .jornada-pill button.on{background:var(--tinta);color:#fff}

  /* NAVEGACIÓN GLOBAL CONSISTENTE */
  .nav-global{display:flex;align-items:center;gap:8px}
  .btn-nav-top{background:#F2F7FA;color:var(--tinta);border:1px solid var(--linea);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .btn-nav-top:hover{background:var(--tinta);color:#fff;border-color:var(--tinta)}

  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra)}
  .kpi .lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2)}
  .kpi .val{font-family:'IBM Plex Mono';font-weight:600;font-size:28px;color:var(--tinta);margin-top:4px}
  .kpi .val.alerta-c{color:var(--alerta)}
  .kpi .sub{font-size:12px;color:var(--texto-2);margin-top:2px}
  
  .panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
  .panel .panel-head{padding:16px 20px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .panel .panel-head h3{font-size:15.5px;color:var(--tinta)}
  .panel .panel-body{padding:16px 20px 20px}
  .dos-col{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
  @media(max-width:1080px){.dos-col{grid-template-columns:1fr}}

  .alerta-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--linea)}
  .alerta-row:last-child{border-bottom:none}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.critica{background:var(--alerta);box-shadow:0 0 0 4px var(--alerta-suave);animation:pulso 1.6s infinite}
  .dot.vigilancia{background:var(--vigilancia);box-shadow:0 0 0 4px var(--vigilancia-suave)}
  @keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .alerta-row .que{flex:1;min-width:0}
  .alerta-row .que b{font-size:13.5px}
  .alerta-row .que span{display:block;font-size:12px;color:var(--texto-2)}
  .alerta-row .val{font-family:'IBM Plex Mono';font-weight:600;font-size:14.5px}
  .alerta-row .val.c{color:var(--alerta)} .alerta-row .val.v{color:var(--vigilancia)}

  .bitacora{position:relative;padding-left:24px}
  .bitacora:before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--linea),transparent)}
  .nota-item{position:relative;padding:12px 0 14px;border-bottom:1px dashed var(--linea)}
  .nota-item:last-child{border-bottom:none}
  .nota-item:before{content:'';position:absolute;left:-21px;top:18px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid var(--vital)}
  .nota-item.tipo-novedad_salud:before{border-color:var(--vigilancia)}
  .nota-item.tipo-activacion_emergencia:before{border-color:var(--alerta)}
  .nota-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--texto-2);margin-bottom:5px}
  .tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;letter-spacing:.02em}
  .tag.evolucion{background:var(--vital-suave);color:#0A7A5A}
  .tag.ingreso{background:#E8F0F6;color:var(--tinta)}
  .tag.novedad_salud{background:var(--vigilancia-suave);color:#9A6A14}
  .tag.administracion_medicamento{background:#EEEAF8;color:#5B4A9E}
  .tag.activacion_emergencia{background:var(--alerta-suave);color:var(--alerta)}
  .tag.actividad_salud{background:#E6F4F8;color:#11697F}
  .tag.general_jornada{background:#EEF2F4;color:var(--texto-2)}
  .nota-txt{font-size:14px}
  .nota-signos{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
  .chip-signo{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;background:#F2F7FA;border:1px solid var(--linea);color:var(--texto)}
  .chip-signo.v{background:var(--vigilancia-suave);border-color:#EDD8AE;color:#9A6A14}
  .chip-signo.c{background:var(--alerta-suave);border-color:#F2C4B6;color:var(--alerta)}
  .badge-e2ee{background:var(--cifrado-suave);color:var(--cifrado);border:1px solid #C7D2FE;padding:2px 7px;border-radius:6px;font-weight:600;font-size:10.5px}
  .badge-hash{background:#EEF2F4;color:var(--texto-2);border:1px solid var(--linea);padding:2px 7px;border-radius:6px;font-family:'IBM Plex Mono';font-size:10.5px}

  .buscador{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .buscador input{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--linea);border-radius:11px;background:#fff}
  .grid-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .res-card{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);text-align:left;transition:transform .12s,box-shadow .15s,border-color .15s}
  .res-card:hover{transform:translateY(-2px);border-color:var(--vital);box-shadow:0 10px 28px -12px rgba(14,58,93,.25)}
  .res-card .top{display:flex;gap:11px;align-items:center;margin-bottom:10px}
  .res-card .nom{font-weight:600;font-size:14.5px;line-height:1.2}
  .res-card .doc{font-size:12px;color:var(--texto-2)}
  .res-card .dx{font-size:12px;color:var(--texto-2);margin-bottom:10px;min-height:18px}
  .res-card .pie{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texto-2)}
  .estado-pill{font-size:11px;font-weight:700;border-radius:99px;padding:2.5px 9px}
  .estado-pill.ok{background:var(--vital-suave);color:#0A7A5A}
  .estado-pill.v{background:var(--vigilancia-suave);color:#9A6A14}
  .estado-pill.c{background:var(--alerta-suave);color:var(--alerta)}
  .estado-pill.na{background:#EEF2F4;color:var(--texto-2)}

  .ficha-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .avatar-xl{width:56px;height:56px;border-radius:16px;background:var(--tinta);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:20px}
  .ficha-head h2{font-size:20px;color:var(--tinta)}
  .ficha-head .meta{font-size:13px;color:var(--texto-2)}
  .grid-signos{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
  .signo-card{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:14px 15px;box-shadow:var(--sombra);position:relative;overflow:hidden}
  .signo-card .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2)}
  .signo-card .num{font-family:'IBM Plex Mono';font-weight:600;font-size:24px;margin-top:5px;color:var(--tinta)}
  .signo-card .num small{font-size:12px;color:var(--texto-2);font-weight:500}
  .signo-card.v .num{color:#B07914}.signo-card.c .num{color:var(--alerta)}
  .signo-card.na .num{color:var(--texto-2);font-size:17px;padding-top:6px}
  .signo-card .borde{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vital)}
  .signo-card.v .borde{background:var(--vigilancia)}.signo-card.c .borde{background:var(--alerta)}
  .signo-card.na .borde{background:#C7D4DB}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .form-grid .full{grid-column:1/-1}
  .campo-signo{position:relative}
  .campo-signo .estado{position:absolute;right:10px;top:34px;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px}
  .campo-signo .estado.ok{background:var(--vital-suave);color:#0A7A5A}
  .campo-signo .estado.v{background:var(--vigilancia-suave);color:#9A6A14}
  .campo-signo .estado.c{background:var(--alerta-suave);color:var(--alerta)}
  .form-foot{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
  .nota-aviso{font-size:12.5px;color:var(--texto-2);display:flex;gap:7px;align-items:flex-start;background:#F2F7FA;border:1px solid var(--linea);border-radius:10px;padding:10px 13px;margin-top:16px}
  .nota-aviso.rojo{background:var(--alerta-suave);border-color:#F2C4B6;color:#8C3018}
  .nota-aviso.cifrado{background:var(--cifrado-suave);border-color:#C7D2FE;color:#3730A3}

  /* MODALES Y OVERLAYS */
  .overlay{position:fixed;inset:0;background:rgba(14,58,93,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:110;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:18px;box-shadow:0 24px 64px -16px rgba(14,58,93,.4);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:28px}
  .modal h3{color:var(--tinta);font-size:19px;margin-bottom:4px}
  .modal .sub{font-size:13px;color:var(--texto-2);margin-bottom:18px}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .legal-box{background:#F8FAFC;border:1px solid var(--linea);border-radius:10px;padding:16px;font-size:12.5px;color:var(--texto);max-height:220px;overflow-y:auto;line-height:1.5;margin-bottom:14px}
  .legal-box h4{font-size:13px;color:var(--tinta);margin:10px 0 4px}

  /* SWITCH */
  .switch-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px dashed var(--linea)}
  .switch-row:last-child{border-bottom:none}
  .switch-row .info{flex:1}
  .switch-row .info b{font-size:14.5px}
  .switch-row .info p{font-size:12.5px;color:var(--texto-2);margin-top:2px}
  .switch{position:relative;width:46px;height:26px;flex:none;background:#C7D4DB;border-radius:99px;transition:background .15s;padding:0}
  .switch.on{background:var(--vital)}
  .switch:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch.on:after{left:23px}

  /* TABLAS OPERATIVAS */
  table.op{width:100%;border-collapse:collapse;font-size:13.5px}
  table.op th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-2);padding:9px 10px;border-bottom:1.5px solid var(--linea)}
  table.op td{padding:10px;border-bottom:1px dashed var(--linea);vertical-align:middle}
  table.op tr:last-child td{border-bottom:none}
  .seg{display:inline-flex;border:1.5px solid var(--linea);border-radius:99px;overflow:hidden}
  .seg button{padding:5px 11px;font-size:12px;font-weight:600;background:#fff;color:var(--texto-2)}
  .seg button.si{background:var(--vital);color:#fff}
  .seg button.no{background:var(--alerta);color:#fff}
  .seg button.nf{background:var(--vigilancia);color:#fff}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tabs button{padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;background:#fff;border:1.5px solid var(--linea);color:var(--texto-2)}
  .tabs button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .tabs button.soon{opacity:.5;cursor:default}
  .lim-chip{font-size:12px;font-weight:600;border-radius:8px;padding:4px 10px;background:#F2F7FA;border:1px solid var(--linea)}
  .lim-chip.lleno{background:var(--alerta-suave);border-color:#F2C4B6;color:var(--alerta)}
  .lim-chip.cerca{background:var(--vigilancia-suave);border-color:#EDD8AE;color:#9A6A14}
  .drop{border:2px dashed var(--linea);border-radius:14px;padding:24px;text-align:center;color:var(--texto-2);font-size:13.5px;background:#FBFDFE}
  .prev-tabla{max-height:240px;overflow:auto;border:1px solid var(--linea);border-radius:10px;margin-top:12px}
  .err-fila{font-size:12.5px;color:var(--alerta);padding:3px 0}

  /* FORMATO SDIS IMPRESIÓN */
  .sdis{background:#fff;border:1.5px solid #9FB4C0;border-radius:6px;font-size:12.5px}
  .sdis-head{display:grid;grid-template-columns:1fr 215px;border-bottom:1.5px solid #9FB4C0}
  .sdis-head .t{padding:14px 18px;display:flex;align-items:center;gap:14px}
  .sdis-head .t .txt{font-weight:600;font-size:12px;line-height:1.45;letter-spacing:.02em}
  .sdis-head .codigo{border-left:1.5px solid #9FB4C0;font-size:11.5px}
  .sdis-head .codigo div{padding:5px 12px;border-bottom:1px solid #C9D6DE}
  .sdis-head .codigo div:last-child{border-bottom:none}
  .sdis-sub{padding:8px 18px;border-bottom:1.5px solid #9FB4C0;font-size:11px;color:#444}

/* ============================ MOTOR CRIPTOGRÁFICO DE EXTREMO A EXTREMO (E2EE) ============================ */
const E2EE = {
  async derivarClave(passphrase, saltHex = 'auracare_salt_2026_v26') {
    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
      "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
    );
    return window.crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: enc.encode(saltHex),
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  },

  async cifrarTexto(texto, secretKey) {
    if(!texto) return texto;
    const enc = new TextEncoder();
    const iv = window.crypto.getRandomValues(new Uint8Array(12));
    const key = await this.derivarClave(secretKey);
    const encrypted = await window.crypto.subtle.encrypt(
      { name: "AES-GCM", iv: iv },
      key,
      enc.encode(texto)
    );
    const ivBase64 = btoa(String.fromCharCode(...iv));
    const dataBase64 = btoa(String.fromCharCode(...new Uint8Array(encrypted)));
    return `E2EE::${ivBase64}::${dataBase64}`;
  },

  async descifrarTexto(cifradoStr, secretKey) {
    if(!cifradoStr || typeof cifradoStr !== 'string' || !cifradoStr.startsWith('E2EE::')) return cifradoStr;
    try {
      const parts = cifradoStr.split('::');
      const iv = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(parts[2]), c => c.charCodeAt(0));
      const key = await this.derivarClave(secretKey);
      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        data
      );
      return new TextDecoder().decode(decrypted);
    } catch(e) {
      return "[Error Cifrado: Clave no válida o dato manipulado]";
    }
  },

  async generarHashNota(nota, prevHash = "GENESIS_BLOCK_2026") {
    const enc = new TextEncoder();
    const payload = `${prevHash}|${nota.id}|${nota.fecha}|${nota.hora}|${nota.personaId}|${nota.descripcion}|${nota.autor}`;
    const hashBuffer = await window.crypto.subtle.digest('SHA-256', enc.encode(payload));
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
  }
};

const Sparkline = ({ data, estado }) => {
  if(!data || data.length < 2) return null;
  const w = 120, h = 26, min = Math.min(...data), max = Math.max(...data);
  const norm = v => max === min ? h/2 : h - 3 - ((v - min)/(max - min))*(h - 6);
  const pts = data.map((v,i)=> `${(i/(data.length-1))*w},${norm(v).toFixed(1)}`).join(' ');
  const color = estado === 'c' ? 'var(--alerta)' : estado === 'v' ? 'var(--vigilancia)' : 'var(--vital)';
  return <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
    <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" opacity="0.9"/></svg>;
};

    chips.push(<span key="ta" className={'chip-signo ' + (peor!=='ok'?peor:'')}>TA {signos.ta_s}/{signos.ta_d || '—'} mmHg</span>);

  const txt = { fc:v=>`FC ${v} lpm`, fr:v=>`FR ${v} rpm`, temp:v=>`T° ${v}°C`, spo2:v=>`SpO₂ ${v}%`, glu:v=>`Glu ${v} mg/dL` };

      chips.push(<span key={k} className={'chip-signo ' + (e!=='ok'?e:'')}>{txt[k](signos[k])}</span>);

  });

/* ============================ IMPORTADOR EXCEL ============================ */
const Importador = ({ sede, onImportar, cerrar }) => {
  const [arrastrando, setArrastrando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const fileRef = useRef(null);

  const procesar = async (file) => {
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(ws, { defval:'' });
      const validas = [], errores = [];
      filas.forEach((fila, i) => {
        const n = fila.nombres || fila.Nombre || fila.nombres_completos;
        const a = fila.apellidos || fila.Apellido;
        if(!n || !a){ errores.push('Fila ' + (i+2) + ': Faltan nombres o apellidos'); return; }
        validas.push({
          nombres: String(n).trim(), apellidos: String(a).trim(),
          doc: String(fila.documento || fila.cedula || 'CC s/n').trim(),
          edad: fila.edad ? Number(fila.edad) : null, dx: fila.diagnostico || fila.dx || 'Sin registrar'
        });
      });
      setResultado({ validas, errores, archivo:file.name });
    } catch(e){
      setResultado({ validas:[], errores:['Error al leer archivo Excel/CSV.'], archivo:file.name });
    }
  };

  return (
    <div className="overlay" onClick={e => { if(e.target === e.currentTarget) cerrar(); }}>
      <div className="modal">
        <h3>Importar residentes desde Excel / CSV</h3>
        <p className="sub">Carga masiva a {sede.nombre}.</p>
        {!resultado ? (
          <div className="drop" onDragOver={e=>{e.preventDefault();setArrastrando(true);}} onDrop={e=>{e.preventDefault();if(e.dataTransfer.files[0]) procesar(e.dataTransfer.files[0]);}}>
            Arrastra aquí tu archivo .xlsx o .csv<br/>
            <button className="btn btn-ghost" style={{marginTop:'12px'}} onClick={()=>fileRef.current.click()}>Elegir archivo…</button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" hidden onChange={e=>{if(e.target.files[0]) procesar(e.target.files[0]);}} />
          </div>
        ) : (
          <div>
            <p><b>{resultado.archivo}</b> · <span style={{color:'var(--vital)'}}>{resultado.validas.length} filas válidas</span></p>
            {resultado.validas.length > 0 && (
              <div className="prev-tabla">
                <table className="op">
                  <thead><tr><th>Nombres</th><th>Apellidos</th><th>Doc</th><th>Edad</th></tr></thead>
                  <tbody>{resultado.validas.map((v,i)=><tr key={i}><td>{v.nombres}</td><td>{v.apellidos}</td><td>{v.doc}</td><td>{v.edad||'—'}</td></tr>)}</tbody>
                </table>
              </div>
            )}
            <div className="modal-foot">
              <button className="btn btn-ghost" onClick={()=>setResultado(null)}>← Volver</button>
              <button className="btn btn-primary" onClick={()=>onImportar(resultado.validas)}>Importar {resultado.validas.length} residente(s)</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

          {notasRes.length === 0 ? <div className="vacio">Esta persona aún no tiene notas registradas.</div> :

/* ============================ NUEVA NOTA CON RANGOS CLÍNICOS OMS Y BANDERAS EN VIVO ============================ */
const NuevaNota = ({ sede, residentes, jornada, presel, config, onGuardar }) => {
  const [personaId, setPersonaId] = useState(presel || '');
  const [tipo, setTipo] = useState('evolucion');
  const [desc, setDesc] = useState('');
  const [sv, setSv] = useState({ ta_s:'', ta_d:'', fc:'', fr:'', temp:'', spo2:'', glu:'', dolor:'' });
  const set = (k,v) => setSv(p=>({...p,[k]:v}));

  const guardar = () => {
    if(desc.trim().length < 10) return;
    const signos = {};
    Object.keys(sv).forEach(k => { if(sv[k] !== '') signos[k] = Number(sv[k]); });
    onGuardar({ personaId: personaId || null, tipo, descripcion: desc.trim(), signos });
  };

  const campos = [
    ['ta_s','TA sistólica (mmHg)', RANGOS.ta_s],
    ['ta_d','TA diastólica (mmHg)', RANGOS.ta_d],
    ['fc','Frec. cardiaca (lpm)', RANGOS.fc],
    ['fr','Frec. respiratoria (rpm)', RANGOS.fr],
    ['temp','Temperatura (°C)', RANGOS.temp],
    ['spo2','Saturación O₂ (%)', RANGOS.spo2],
  ];
  if(config.glu) campos.push(['glu','Glucometría (mg/dL)', RANGOS.glu]);

  return (
    <div className="panel" style={{maxWidth:'880px'}}>
      <div className="panel-head"><h3>Nueva nota médica · {sede.nombre} · Jornada {jornada === 'dia' ? 'Día' : 'Noche'}</h3></div>
      <div className="panel-body">
        <div className="form-grid">
          <div className="field">
            <label>Persona mayor</label>
            <select value={personaId} onChange={e=>setPersonaId(e.target.value)}>
              <option value="">Novedad general de la jornada</option>
              {residentes.map(r => <option key={r.id} value={r.id}>{r.nombres} {r.apellidos} — {r.doc}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Tipo de nota</label>
            <select value={tipo} onChange={e=>setTipo(e.target.value)}>
              {TIPOS_NOTA.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </div>

          {campos.map(([k, lbl, r]) => {
            const e = estadoSigno(k, sv[k]);
            return (
              <div key={k} className="field campo-signo">
                <label>
                  {lbl}
                  <span className="rango-hint">Norm: {r.normal} | Vig: {r.vig} | Crit: {r.crit}</span>
                </label>
                <input type="number" step="any" value={sv[k]} onChange={ev=>set(k, ev.target.value)} placeholder="—" />
                {e && <span className={'estado ' + e}>{e==='ok'?'NORMAL':e==='v'?'SOSPECHOSO':'CRÍTICO'}</span>}
              </div>
            );
          })}

          <div className="field full">
            <label>Descripción de la novedad (mínimo 10 caracteres)</label>
            <textarea rows="4" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Escriba la valoración clínica o conducta observada…"></textarea>
          </div>
        </div>

        <div className="form-foot">
          <button className="btn btn-primary" disabled={desc.trim().length < 10} onClick={guardar}>Guardar Nota Firmada E2EE</button>
        </div>
      </div>
    </div>
  );
};

  const [pertenencias, setPertenencias] = useState(PERTENENCIAS_INI);
  const [configSedes, setConfigSedes] = useState({ cund:{glu:true,dolor:true}, samp:{glu:false,dolor:true}, favo:{glu:true,dolor:false} });

  const [fichaId, setFichaId] = useState(null);
  const [preselNota, setPreselNota] = useState('');
  const [modal, setModal] = useState(null);
  const [showCookie, setShowCookie] = useState(false);
  const [showLegal, setShowLegal] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const consent = localStorage.getItem('auracare_cookie_consent');
    if(!consent) setShowCookie(true);
  }, []);

  const avisar = msg => { setToast(msg); setTimeout(() => setToast(null), 3400); };

  const navegarA = (nuevaVista) => {
    if(view !== nuevaVista){
      setNavStack(prev => [...prev, nuevaVista]);
      setView(nuevaVista);
    }
  };

  const goBack = () => {
    if(navStack.length > 1){
      const nuevoStack = [...navStack];
      nuevoStack.pop();
      const previa = nuevoStack[nuevoStack.length - 1];
      setNavStack(nuevoStack);
      setView(previa);
    } else {
      setView('panel');
    }
  };

  const loginUsuario = (email, password) => {
    const enco = usuarios.find(u => u.email.toLowerCase() === email.toLowerCase());
    if(!enco){
      avisar('⛔ Usuario no encontrado. Regístrese o solicite invitación.');
      return;
    }
    if(enco.estado === 'pendiente'){
      avisar('ℹ️ Cuenta Pendiente de Aprobación por un Administrador.');
      return;
    }
    const r = ROLES.find(x => x.id === enco.rolId) || ROLES[0];
    setUsuarioActivo(enco);
    setRolActivo(r);
    setSecretPass(password);
    setSedeId(enco.sedeId || 'cund');
    setJornada('dia');
    setPantalla('app');
    setNavStack(['panel']);
    setView('panel');
    avisar(`Sesión iniciada: ${enco.nombre} (${r.nombre}) ✓`);
  };

  const solicitarCuenta = ({ nombre, email }) => {
    const nuevo = { id:'u' + Date.now(), nombre, email, rolId:'auxiliar', sedeId:'cund', jornadaPermitida:'ambos', estado:'pendiente' };
    setUsuarios(prev => [...prev, nuevo]);
    avisar('Solicitud enviada ✓ Pendiente de aprobación por un Administrador.');
  };

  const logout = () => {
    setUsuarioActivo(null);
    setPantalla('login');
    setNavStack(['panel']);
    avisar('Sesión cerrada con seguridad ✓');
  };

  const cambiarJornada = (nuevaJornada) => {
    setJornada(nuevaJornada);
    avisar(`Jornada activa: ${nuevaJornada.toUpperCase()} ✓`);
  };

  const guardarNota = async ({ personaId, tipo, descripcion, signos }) => {
    const hora = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false});
    const autorStr = `${usuarioActivo ? usuarioActivo.nombre : 'Claudia M. Ríos'} (${rolActivo.nombre})`;

    const descCifrada = await E2EE.cifrarTexto(descripcion, secretPass);
    const prevNota = notas[notas.length - 1];
    const prevHash = prevNota ? prevNota.hash : "GENESIS_2026";
    const notaTemp = { id:'n' + (++SEQ), sedeId, personaId, tipo, jornada, fecha:hoyISO, hora, descripcion, autor: autorStr };
    const nuevoHash = await E2EE.generarHashNota(notaTemp, prevHash);

    const nuevasAlertas = [];
    Object.keys(signos).forEach(k => {
      const e = estadoSigno(k, signos[k]);
      if(e === 'c' || e === 'v') nuevasAlertas.push({ id:'a' + (++SEQ), sedeId, personaId, parametro:k, valor:signos[k], sev: e==='c'?'critica':'vigilancia', estado:'activa', hora });
    });

    const nueva = {
      ...notaTemp,
      descripcion,
      descripcionCifrada: descCifrada,
      signos,
      cargo: rolActivo.nombre,
      vigente: true,
      e2ee: true,
      hash: nuevoHash
    };

    setNotas(prev => [...prev, nueva]);
    if(nuevasAlertas.length) setAlertas(prev => [...prev, ...nuevasAlertas]);
    if(personaId) setResidentes(prev => prev.map(r => r.id === personaId ? {...r, signos:{...r.signos, ...signos}} : r));

    avisar(nuevasAlertas.some(a=>a.sev==='critica') ? '⚠ ALERTA CRÍTICA OMS generada y notificada' : '🔒 Nota Cifrada E2EE y Asentada con Hash SHA-256 ✓');
    if(personaId){ setFichaId(personaId); navegarA('ficha'); } else navegarA('panel');
  };

  const atenderAlerta = id => {
    setAlertas(prev => prev.map(a => a.id === id ? {...a, estado:'atendida'} : a));
    avisar('Alerta atendida ✓');
  };

  if(pantalla === 'login') return (
    <React.Fragment>
      <Login usuarios={usuarios} onLogin={loginUsuario} onSolicitarCuenta={solicitarCuenta} abrirTerminos={() => setShowLegal(true)} />
      {showCookie && <CookieBanner onAceptar={() => { localStorage.setItem('auracare_cookie_consent','all'); setShowCookie(false); }} onRechazar={() => { localStorage.setItem('auracare_cookie_consent','necessary'); setShowCookie(false); }} abrirTerminos={() => setShowLegal(true)} />}
      {showLegal && <ModalLegal cerrar={() => setShowLegal(false)} />}
    </React.Fragment>
  );

  const sede = sedes.find(s => s.id === sedeId) || sedes[0];
  const config = configSedes[sedeId] || { glu:true, dolor:true };
  const resSede = residentes.filter(r => r.sedeId === sedeId);
  const fichaRes = residentes.find(r => r.id === fichaId);

  const puedeVer = mod => rolActivo.modulos.includes(mod);

  return (
    <div className="shell">
      <aside className="sidebar no-print">
        <Logo dark />
        <div className="sede-select">
          <label htmlFor="sel-sede">Unidad operativa</label>
          <select id="sel-sede" value={sedeId} onChange={e=>{ setSedeId(e.target.value); navegarA('panel'); }}>
            {sedes.map(s => <option key={s.id} value={s.id}>{s.nombre}</option>)}
          </select>
        </div>
        <nav className="nav" aria-label="Navegación principal">
          {puedeVer('panel') && <button className={view==='panel'?'active':''} onClick={()=>navegarA('panel')}>◳ Panel General</button>}
          {puedeVer('residentes') && <button className={view==='residentes'||view==='ficha'?'active':''} onClick={()=>navegarA('residentes')}>♥ Residentes</button>}
          {puedeVer('nueva') && <button className={view==='nueva'?'active':''} onClick={()=>{ setPreselNota(''); navegarA('nueva'); }}>＋ Nueva Nota</button>}
          {puedeVer('asistencia') && <button className={view==='asistencia'?'active':''} onClick={()=>navegarA('asistencia')}>☑ Asistencia & Actividades</button>}
          {puedeVer('dotacion') && <button className={view==='dotacion'?'active':''} onClick={()=>navegarA('dotacion')}>⛨ Dotación de Elementos</button>}
          {puedeVer('entrega') && <button className={view==='entrega'?'active':''} onClick={()=>navegarA('entrega')}>🤝 Entrega de Turno</button>}
          {puedeVer('sdis') && <button className={view==='sdis'?'active':''} onClick={()=>navegarA('sdis')}>▤ Registro SDIS</button>}
          {puedeVer('config') && <button className={view==='config'?'active':''} onClick={()=>navegarA('config')}>⚙ Configuración</button>}
          {puedeVer('admin_usuarios') && <button className={view==='admin_usuarios'?'active':''} onClick={()=>navegarA('admin_usuarios')}>👥 Gestión de Usuarios</button>}
        </nav>
        <div className="sidebar-foot">
          Fundación Construyendo Futuro ONG<br/>NIT 900310195-2 · Ley 1581 / SDIS<br/>
          <b>AuraCare Notaría Médica</b>
        </div>
      </aside>

      <main className="main">
        {/* TOPBAR CABECERA CON NAVEGACIÓN GLOBAL CONSISTENTE (EL BOTÓN ATRÁS SE OCULTA ÚNICAMENTE EN PANEL) */}
        <div className="topbar no-print">
          <div className="nav-global">
            {view !== 'panel' && (
              <button className="btn-nav-top" onClick={goBack} title="Volver a la pantalla anterior">⬅ Atrás</button>
            )}
          </div>
          <div className="titulo">
            <h2>{view === 'panel' ? 'Panel General' : view === 'residentes' ? 'Personas Mayores' : view === 'ficha' ? 'Ficha Clínica' : view === 'nueva' ? 'Nueva Nota Médica' : view === 'asistencia' ? 'Asistencia & Actividades' : view === 'dotacion' ? 'Dotación de Elementos' : view === 'entrega' ? 'Entrega de Turno' : view === 'sdis' ? 'Registro SDIS FOR-PSS-729' : view === 'config' ? 'Configuración' : view === 'admin_usuarios' ? 'Gestión de Usuarios' : 'Mi Perfil'}</h2>
            <p>{sede.nombre} · {fmtFecha(hoyISO)}</p>
          </div>
          <div className="spacer"></div>

          <div className="jornada-pill" role="group" aria-label="Jornada de atención">
            <button className={jornada==='dia'?'on':''} onClick={()=>cambiarJornada('dia')}>☀ Día</button>
            <button className={jornada==='noche'?'on':''} onClick={()=>cambiarJornada('noche')}>☾ Noche</button>
          </div>

          <div className="nav-global">
            <button className="btn-nav-top" onClick={()=>navegarA('perfil')}>👤 Mi Perfil</button>
            <button className="btn-nav-top" style={{color:'var(--alerta)',borderColor:'#F2C4B6'}} onClick={logout}>🚪 Salir</button>
          </div>
        </div>

        {/* VISTAS OPERATIVAS */}
        {view === 'panel' && <Dashboard sede={sede} residentes={resSede} notas={notas} alertas={alertas} asistencias={asistencias} onAtender={atenderAlerta} jornada={jornada} />}
        
        {view === 'residentes' && <Residentes residentes={resSede} irFicha={id=>{setFichaId(id);navegarA('ficha');}} abrirNuevo={()=>setModal('nuevo')} abrirImport={()=>setModal('import')} />}
        
        {view === 'ficha' && fichaRes && <Ficha res={fichaRes} notas={notas} config={configSedes[fichaRes.sedeId] || {glu:true,dolor:true}} volver={()=>navegarA('residentes')} nuevaNotaPara={id=>{ setPreselNota(id); navegarA('nueva'); }} />}
        
        {view === 'nueva' && <NuevaNota sede={sede} residentes={resSede} jornada={jornada} presel={preselNota} config={config} onGuardar={guardarNota} />}
        
        {view === 'asistencia' && <Asistencia sede={sede} residentes={resSede} asistencias={asistencias} setAsist={setAsistencias} actividades={actividades} setActs={setActividades} jornada={jornada} avisar={avisar} />}
        
        {view === 'dotacion' && <Dotacion sede={sede} residentes={resSede} entregas={entregas} setEntregas={setEntregas} pertenencias={pertenencias} setPert={setPertenencias} avisar={avisar} />}
        
        {view === 'entrega' && <EntregaTurno sede={sede} jornada={jornada} residentes={resSede} notas={notas} alertas={alertas} usuario={usuarioActivo} />}
        
        {view === 'sdis' && <RegistroSdis sede={sede} notas={notas} residentes={resSede} jornada={jornada} />}
        
        {view === 'config' && <Config sedes={sedes} setSedes={setSedes} sede={sede} config={config} setConfig={setConfigSedes} avisar={avisar} />}
        
        {view === 'admin_usuarios' && <AdminUsuarios usuarios={usuarios} setUsuarios={setUsuarios} sedes={sedes} sede={sede} avisar={avisar} />}
        
        {view === 'perfil' && <PerfilUsuario usuario={usuarioActivo} rol={rolActivo} sede={sede} jornada={jornada} onLogout={logout} />}
      </main>

      {modal === 'nuevo' && <NuevoResidente sede={sede} onCrear={f=>{
        setResidentes(prev=>[...prev,{ id:'r'+Date.now(), sedeId:sede.id, nombres:f.nombres.trim(), apellidos:f.apellidos.trim(), doc:f.numDoc||'CC s/n', edad:f.edad?Number(f.edad):null, dx:f.dx||'Sin registrar', signos:{}, hist:{} }]);
        setModal(null); avisar('Residente registrado ✓');
      }} cerrar={()=>setModal(null)} />}
      
      {modal === 'import' && <Importador sede={sede} onImportar={lista=>{
        setResidentes(prev=>[...prev,...lista.map((v,i)=>({ id:'r'+Date.now()+'_'+i, sedeId:sede.id, nombres:v.nombres, apellidos:v.apellidos, doc:v.doc, edad:v.edad, dx:v.dx, signos:{}, hist:{} }))]);
        setModal(null); avisar(lista.length + ' residente(s) importados ✓');
      }} cerrar={()=>setModal(null)} />}

      {showLegal && <ModalLegal cerrar={() => setShowLegal(false)} />}
      {toast && <div className="toast" role="status">{toast}</div>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
